<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Prompt Tuner">
  <!--
    The scorecard's tally marks, read as a level: four bars at uneven heights
    with the last one still short. Same device the review grades a draft with,
    and the same blue pencil, so the tab matches the page.

    No panel behind it — a paper-coloured tile disappears against a light
    browser tab and leaves an empty box. The bars carry the mark instead, and
    the unfilled one is the accent at low opacity so it reads correctly on any
    background rather than only on white.
  -->
  <style>
    .bar { fill: #2b4fa8; }
    @media (prefers-color-scheme: dark) {
      .bar { fill: #8ba7f0; }
    }
  </style>

  <g class="bar">
    <rect x="3.5"  y="9"    width="4" height="14" />
    <rect x="10.5" y="4"    width="4" height="24" />
    <rect x="17.5" y="6.5"  width="4" height="19" />
    <rect x="24.5" y="11"   width="4" height="10" opacity="0.35" />
  </g>
</svg>
